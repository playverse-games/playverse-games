<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Dice</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.dice{
font-size:100px;
margin:40px;
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-size:18px;
font-weight:bold;
}

.result{
margin-top:25px;
font-size:22px;
color:#00eaff;
}

</style>

</head>

<body>

<header>
🎲 PlayVerse Dice
</header>


<h2>Hard Dice Challenge</h2>

<p>Reach the target number to win.</p>

<h3>
Target: <span id="target">6</span>
</h3>


<div class="dice" id="dice">
🎲
</div>


<button onclick="rollDice()">
ROLL DICE
</button>


<div class="result" id="result">
Ready?
</div>


<script>

let target=6;


function rollDice(){

let roll=Math.floor(Math.random()*6)+1;


let faces=[
"⚀",
"⚁",
"⚂",
"⚃",
"⚄",
"⚅"
];


document.getElementById("dice").innerHTML=
faces[roll-1];


if(roll===target){

document.getElementById("result").innerHTML=
"🏆 Perfect Roll! You Win";


// make next round harder

target=Math.floor(Math.random()*3)+4;

document.getElementById("target").innerHTML=
target;


}else{

document.getElementById("result").innerHTML=
"❌ Wrong Roll. Try Again.";

}

}

</script>


</body>
</html>
