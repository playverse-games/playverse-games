<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Cards</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.cards{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin:30px auto;
max-width:400px;
}

.card{
width:80px;
height:110px;
background:#252b50;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
cursor:pointer;
}

.card:hover{
background:#00eaff;
color:black;
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-size:18px;
font-weight:bold;
}

.result{
margin-top:20px;
font-size:22px;
color:#00eaff;
}

</style>

</head>

<body>

<header>
🃏 PlayVerse Cards
</header>

<h2>Hard Card Challenge</h2>

<p>Find the winning card. Wrong choice = Fail.</p>


<div class="cards" id="cards"></div>


<button onclick="startGame()">
NEW GAME
</button>


<div class="result" id="result">
Choose a card
</div>



<script>

let winner;


function startGame(){

let box=document.getElementById("cards");

box.innerHTML="";


winner=Math.floor(Math.random()*8);


for(let i=0;i<8;i++){

let card=document.createElement("div");

card.className="card";

card.innerHTML="🂠";


card.onclick=function(){

if(i===winner){

card.innerHTML="🏆";

document.getElementById("result").innerHTML=
"🏆 You Win!";

}else{

card.innerHTML="❌";

document.getElementById("result").innerHTML=
"❌ Wrong Card. You Lose.";

}

};


box.appendChild(card);

}


document.getElementById("result").innerHTML=
"Choose your card";

}


</script>


</body>
</html>
