<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Target</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b18;
    color:white;
    text-align:center;
}

header{
    background:#11162b;
    padding:20px;
    color:#00eaff;
    font-size:24px;
    font-weight:bold;
}

.game{
    width:90%;
    max-width:400px;
    height:450px;
    margin:20px auto;
    background:#151b35;
    border:2px solid #00eaff;
    border-radius:15px;
    position:relative;
    overflow:hidden;
}

.target{
    position:absolute;
    font-size:35px;
    cursor:pointer;
    transition:.2s;
}

button{
    background:#00eaff;
    border:none;
    padding:15px 35px;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
}

.stats{
    margin:15px;
    font-size:20px;
}

.result{
    margin-top:20px;
    color:#00eaff;
    font-size:22px;
}

</style>

</head>

<body>

<header>
🎯 PlayVerse Target
</header>

<h2>Hard Target Challenge</h2>

<div class="stats">
Targets: <span id="hits">0</span>/10
</div>

<div class="game" id="game">

<div class="target" id="target" onclick="hitTarget()">
🎯
</div>

</div>

<button onclick="startGame()">
START GAME
</button>

<div class="result" id="result">
Hit the target. Missing means failure!
</div>


<script>

let hits=0;
let running=false;
let moveTimer;
let speed=700;


function startGame(){

hits=0;
speed=700;
running=true;

document.getElementById("hits").innerHTML=hits;
document.getElementById("result").innerHTML=
"Game Started!";

moveTarget();

}


function moveTarget(){

clearInterval(moveTimer);


moveTimer=setInterval(()=>{

if(!running) return;


let target=document.getElementById("target");


let x=Math.random()*330;
let y=Math.random()*380;


target.style.left=x+"px";
target.style.top=y+"px";


// Sometimes become faster
if(Math.random()>0.6){

speed=Math.max(200,speed-100);

}


},speed);

}



function hitTarget(){

if(!running) return;


hits++;

document.getElementById("hits").innerHTML=hits;


if(hits>=10){

winGame();

}else{

document.getElementById("result").innerHTML=
"🎯 Good hit!";

}

}



document.getElementById("game").onclick=function(e){

if(e.target.id!=="target" && running){

loseGame();

}

}



function loseGame(){

running=false;

clearInterval(moveTimer);

document.getElementById("result").innerHTML=
"❌ You missed! Game Failed.";

}



function winGame(){

running=false;

clearInterval(moveTimer);

document.getElementById("result").innerHTML=
"🏆 You completed the challenge!";

}

</script>

</body>
</html>
