<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Trading</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#080b18;
color:white;
}


header{
background:#11162b;
padding:18px;
text-align:center;
color:#00eaff;
font-size:24px;
font-weight:bold;
}


.container{
padding:20px;
max-width:600px;
margin:auto;
}


.card{
background:#11162b;
border:1px solid #252b50;
border-radius:15px;
padding:20px;
margin-bottom:20px;
}


.balance{
display:flex;
justify-content:space-between;
}


.chart{
height:250px;
background:#090d1d;
border-radius:12px;
border:1px solid #252b50;
position:relative;
overflow:hidden;
}


.line{
position:absolute;
bottom:40px;
left:0;
width:100%;
height:3px;
background:#00eaff;
transform:rotate(-5deg);
animation:move 2s infinite alternate;
}


@keyframes move{

from{
transform:translateY(20px) rotate(-5deg);
}

to{
transform:translateY(-40px) rotate(8deg);
}

}



.price{
font-size:35px;
text-align:center;
color:#00eaff;
margin:20px;
}


button{

width:45%;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;

}


.up{
background:#00c853;
color:white;
}


.down{
background:#ff1744;
color:white;
}


.result{

text-align:center;
font-size:22px;
margin-top:20px;

}


</style>

</head>


<body>


<header>
📈 PlayVerse Trading
</header>



<div class="container">


<div class="card balance">

<div>
💰 Balance
</div>

<div>
$1000
</div>

</div>



<div class="card">


<h3>Market Chart</h3>


<div class="chart">

<div class="line"></div>

</div>



<div class="price">

$<span id="price">100.00</span>

</div>


<button class="up" onclick="predict('up')">
📈 UP
</button>


<button class="down" onclick="predict('down')">
📉 DOWN
</button>



<div class="result" id="result">

Predict the next move

</div>


</div>


</div>



<script>

let price=100;


function predict(choice){


let move=Math.random()>0.5?"up":"down";


if(move==="up"){

price+=Math.random()*10;

}else{

price-=Math.random()*10;

}


document.getElementById("price").innerHTML=
price.toFixed(2);



if(choice===move){

document.getElementById("result").innerHTML=
"🏆 Correct Prediction";

}else{

document.getElementById("result").innerHTML=
"❌ Wrong Prediction";

}


}


</script>


</body>
</html>
