<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Spin</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.wheel{
width:220px;
height:220px;
border-radius:50%;
background:conic-gradient(
#00eaff 0deg 60deg,
#ff4444 60deg 120deg,
#333 120deg 180deg,
#00eaff 180deg 240deg,
#ff4444 240deg 300deg,
#333 300deg 360deg
);
margin:40px auto;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
transition:2s;
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-size:18px;
font-weight:bold;
}

.result{
margin-top:25px;
font-size:22px;
color:#00eaff;
}

</style>

</head>

<body>

<header>
🎡 PlayVerse Spin
</header>


<h2>Hard Spin Challenge</h2>

<p>Spin and test your luck.</p>


<div class="wheel" id="wheel">
🎡
</div>


<button onclick="spin()">
SPIN
</button>


<div class="result" id="result">
Ready?
</div>


<script>

let spinning=false;


function spin(){

if(spinning)return;

spinning=true;


let wheel=document.getElementById("wheel");


let rotate=Math.floor(Math.random()*3600)+720;


wheel.style.transform=
"rotate("+rotate+"deg)";


setTimeout(()=>{


let result=Math.random();


if(result>0.65){

document.getElementById("result").innerHTML=
"🏆 You Win!";

}else{

document.getElementById("result").innerHTML=
"❌ You Lose.";

}


spinning=false;


},2000);


}

</script>


</body>
</html>
