<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Trading</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#050814;
color:white;
}

header{
background:#10162d;
padding:18px;
text-align:center;
color:#00eaff;
font-size:25px;
font-weight:bold;
border-bottom:1px solid #263056;
}

.game{
max-width:600px;
margin:auto;
padding:20px;
}


.panel{
background:#10162d;
border:1px solid #263056;
border-radius:18px;
padding:18px;
margin-bottom:18px;
}


.lock{
text-align:center;
font-size:60px;
}


button{
border:0;
padding:15px;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}


.join{
background:#00eaff;
width:100%;
}


.stats{
display:flex;
justify-content:space-between;
}


.balance{
color:#00eaff;
font-size:25px;
}


.chart{
height:260px;
background:#070b19;
border-radius:15px;
position:relative;
overflow:hidden;
border:1px solid #263056;
}


.line{
position:absolute;
width:120%;
height:4px;
background:#00eaff;
bottom:100px;
left:-20px;
animation:chart 2s infinite alternate;
}


@keyframes chart{

from{
transform:translateY(50px) rotate(-8deg);
}

to{
transform:translateY(-40px) rotate(8deg);
}

}


.price{
text-align:center;
font-size:35px;
color:#00eaff;
margin:15px;
}


.trade{
display:flex;
gap:10px;
}


.up{
background:#00c853;
color:white;
width:50%;
}


.down{
background:#ff1744;
color:white;
width:50%;
}


.result{
text-align:center;
font-size:22px;
margin-top:15px;
}


#tradeArea{
display:none;
}

</style>

</head>

<body>


<header>
📈 PlayVerse Trading
</header>


<div class="game">


<div class="panel" id="lock">


<div class="lock">
🔒
</div>


<h2>
Tournament Trading Locked
</h2>


<p>
Join the $2 tournament to unlock
the $500 demo trading challenge.
</p>


<button class="join" onclick="openTrade()">
JOIN TOURNAMENT
</button>


</div>



<div id="tradeArea">


<div class="panel stats">

<div>
🏆 Score<br>
<span id="score">0</span>
</div>


<div>
Rounds<br>
<span id="round">1</span>
</div>


</div>




<div class="panel">


<h3>Market Movement</h3>


<div class="chart">

<div class="line"></div>

</div>



<div class="price">
$<span id="price">100.00</span>
</div>


</div>




<div class="panel">


<h3>
Make Prediction
</h3>


<div class="trade">


<button class="up" onclick="predict('up')">
📈 UP
</button>


<button class="down" onclick="predict('down')">
📉 DOWN
</button>


</div>


<div class="result" id="result">
Choose your prediction
</div>


</div>



<div class="panel balance">

💰 Demo Balance: $500

</div>


</div>


</div>



<script>


let price=100;
let score=0;
let round=1;



function openTrade(){

document.getElementById("lock").style.display="none";

document.getElementById("tradeArea").style.display="block";

}



function predict(choice){


let movement=Math.random()>0.5?"up":"down";


if(movement==="up"){

price+=Math.random()*8;

}else{

price-=Math.random()*8;

}


document.getElementById("price").innerHTML=
price.toFixed(2);



if(choice===movement){

score+=10;

document.getElementById("result").innerHTML=
"🏆 Prediction Correct";

}else{


document.getElementById("result").innerHTML=
"❌ Prediction Failed";


}


round++;


document.getElementById("score").innerHTML=score;

document.getElementById("round").innerHTML=round;


}


</script>


</body>
</html>
