<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Aviator</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.plane{
font-size:70px;
margin-top:30px;
transition:.3s;
}

.multiplier{
font-size:55px;
color:#00eaff;
margin:20px;
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-size:18px;
font-weight:bold;
margin:10px;
}

.result{
font-size:22px;
margin-top:20px;
}

</style>

</head>

<body>

<header>
✈️ PlayVerse Aviator
</header>


<h2>Hard Flight Challenge</h2>


<div class="plane" id="plane">
✈️
</div>


<div class="multiplier" id="multi">
1.00x
</div>


<button onclick="startFlight()">
START FLIGHT
</button>


<button onclick="cashOut()">
CASH OUT
</button>


<div class="result" id="result">
Ready?
</div>



<script>

let value=1;
let flyAway;
let timer;
let flying=false;


function startFlight(){

if(flying)return;


value=1;

flyAway=(Math.random()*5+1).toFixed(2);

document.getElementById("multi").innerHTML=
"1.00x";

document.getElementById("result").innerHTML=
"Plane is flying...";


flying=true;


timer=setInterval(()=>{


value+=0.12;


document.getElementById("multi").innerHTML=
value.toFixed(2)+"x";


document.getElementById("plane").style.transform=
"translateY(-"+value*5+"px)";


if(value>=flyAway){

clearInterval(timer);

flying=false;

document.getElementById("result").innerHTML=
"✈️ Plane flew away! You lose.";

}


},300);


}



function cashOut(){

if(!flying)return;


clearInterval(timer);

flying=false;


document.getElementById("result").innerHTML=
"🏆 You stopped at "+
value.toFixed(2)+"x";

}


</script>


</body>
</html>
