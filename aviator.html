<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Aviator</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#050814;
color:white;
}

header{
background:#10162d;
padding:18px;
text-align:center;
color:#00eaff;
font-size:25px;
font-weight:bold;
}

.game{
max-width:600px;
margin:auto;
padding:20px;
}


.panel{
background:#10162d;
border:1px solid #263056;
border-radius:18px;
padding:18px;
margin-bottom:18px;
text-align:center;
}


.lock{
font-size:60px;
}


button{
background:#00eaff;
border:none;
padding:15px 30px;
border-radius:12px;
font-weight:bold;
font-size:17px;
}


.flight{
height:300px;
background:#070b19;
border-radius:15px;
position:relative;
overflow:hidden;
}


.plane{
position:absolute;
bottom:30px;
left:45%;
font-size:55px;
transition:.3s;
}


.multiplier{
font-size:55px;
color:#00eaff;
margin:20px;
}


.action{
display:flex;
gap:10px;
}


.action button{
width:50%;
}


.start{
background:#00eaff;
}


.cash{
background:#00c853;
color:white;
}


.result{
font-size:22px;
margin-top:15px;
}


#gameArea{
display:none;
}

</style>

</head>


<body>


<header>
✈️ PlayVerse Aviator
</header>


<div class="game">


<div class="panel" id="lock">


<div class="lock">
🔒
</div>


<h2>
Aviator Locked
</h2>


<p>
Join tournament to unlock the flight challenge.
</p>


<button onclick="unlock()">
JOIN TOURNAMENT
</button>


</div>




<div id="gameArea">


<div class="panel">

<div class="multiplier" id="multi">
1.00x
</div>


<div class="flight">

<div class="plane" id="plane">
✈️
</div>


</div>


</div>



<div class="panel action">


<button class="start" onclick="startFlight()">
START
</button>


<button class="cash" onclick="cashOut()">
CASH OUT
</button>


</div>


<div class="panel result" id="result">
Ready
</div>


</div>


</div>



<script>

let value=1;
let crash;
let timer;
let flying=false;


function unlock(){

document.getElementById("lock").style.display="none";

document.getElementById("gameArea").style.display="block";

}



function startFlight(){

if(flying)return;


value=1;

crash=Math.random()*5+1;

flying=true;


document.getElementById("result").innerHTML=
"✈️ Flying...";


timer=setInterval(()=>{


value+=0.10;


document.getElementById("multi").innerHTML=
value.toFixed(2)+"x";


document.getElementById("plane").style.bottom=
(30+value*20)+"px";



if(value>=crash){


clearInterval(timer);

flying=false;


document.getElementById("result").innerHTML=
"💥 Plane flew away! You lose";


}


},300);


}



function cashOut(){

if(!flying)return;


clearInterval(timer);

flying=false;


document.getElementById("result").innerHTML=
"🏆 Cashed out at "+
value.toFixed(2)+"x";


}


</script>


</body>
</html>
