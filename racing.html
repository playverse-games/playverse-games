<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Racing</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.track{
width:90%;
max-width:400px;
height:500px;
background:#222;
margin:20px auto;
border:3px solid #00eaff;
border-radius:15px;
position:relative;
overflow:hidden;
}

.finish{
position:absolute;
top:20px;
width:100%;
font-size:25px;
}

.car{
position:absolute;
font-size:45px;
}

.player{
bottom:20px;
left:45%;
}

.enemy{
top:80px;
left:45%;
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:22px;
color:#00eaff;
}

</style>
</head>

<body>

<header>
🏎️ PlayVerse Racing
</header>


<h2>Race Against Opponent</h2>

<div class="track">

<div class="finish">
🏁 FINISH
</div>

<div class="car enemy" id="enemy">
🏎️
</div>

<div class="car player" id="player">
🚗
</div>

</div>


<button onclick="startRace()">
START RACE
</button>

<div class="result" id="result">
Ready!
</div>


<script>

let playerPosition=20;
let enemyPosition=80;
let raceRunning=false;


function startRace(){

if(raceRunning)return;

raceRunning=true;

playerPosition=20;
enemyPosition=80;

document.getElementById("result").innerHTML="Race started!";


let race=setInterval(()=>{

// player movement
playerPosition += Math.floor(Math.random()*20)+10;

// opponent movement
enemyPosition += Math.floor(Math.random()*15)+12;


document.getElementById("player").style.bottom=
playerPosition+"px";

document.getElementById("enemy").style.top=
enemyPosition+"px";


// opponent wins
if(enemyPosition>=420){

clearInterval(race);

document.getElementById("result").innerHTML=
"❌ Opponent won! You lose.";

raceRunning=false;

}


// player wins
if(playerPosition>=420){

clearInterval(race);

document.getElementById("result").innerHTML=
"🏆 You won the race!";

raceRunning=false;

}


},500);

}

</script>

</body>
</html>
