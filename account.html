<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Account</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.profile{
background:#11162b;
width:90%;
max-width:400px;
margin:30px auto;
padding:25px;
border-radius:15px;
border:1px solid #252b50;
}

.avatar{
font-size:70px;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:none;
margin:10px;
}

button{
background:#00eaff;
border:none;
padding:12px 30px;
border-radius:25px;
font-weight:bold;
}

.stats{
margin-top:20px;
display:grid;
gap:10px;
}

.box{
background:#151b35;
padding:15px;
border-radius:10px;
}

</style>

</head>

<body>

<header>
👤 PlayVerse Account
</header>


<div class="profile">

<div class="avatar">
🎮
</div>


<h2 id="username">
Player
</h2>


<input id="nameInput" placeholder="Enter username">


<button onclick="saveName()">
SAVE NAME
</button>


<div class="stats">

<div class="box">
Games Played:
<span id="games">0</span>
</div>

<div class="box">
Wins:
<span id="wins">0</span>
</div>

<div class="box">
Losses:
<span id="losses">0</span>
</div>

<div class="box">
Score:
<span id="score">0</span>
</div>

</div>

</div>


<script>

function saveName(){

let name=document.getElementById("nameInput").value;


if(name){

document.getElementById("username").innerHTML=name;

localStorage.setItem("playerName",name);

}

}


let saved=localStorage.getItem("playerName");


if(saved){

document.getElementById("username").innerHTML=saved;

}


</script>


</body>
</html>
