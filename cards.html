<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Cards</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#080b18;
color:white;
min-height:100vh;
}

header{
background:#11162b;
padding:20px;
text-align:center;
border-bottom:1px solid #252b50;
}

.logo{
color:#00eaff;
font-size:26px;
font-weight:bold;
}

.container{
padding:20px;
text-align:center;
}

h1{
margin-bottom:10px;
}

p{
color:#aaa;
margin-bottom:20px;
}

.stats{
display:flex;
justify-content:space-around;
margin-bottom:25px;
}

.box{
background:#151b35;
padding:15px;
border-radius:12px;
width:30%;
}

.game{
max-width:400px;
margin:auto;
}

.cards{
display:flex;
justify-content:center;
gap:20px;
margin:30px 0;
}

.card{
width:120px;
height:170px;
background:#1d2550;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:20px;
color:#00eaff;
}
</style>
</head>

<body>

<header>
<div class="logo">🎮 PlayVerse Games</div>
</header>

<div class="container">

<h1>🃏 Card Challenge</h1>
<p>Pick a card and test your luck.</p>

<div class="stats">

<div class="box">
Round
<br>
<b id="round">0</b>
</div>

<div class="box">
Score
<br>
<b id="score">0</b>
</div>

<div class="box">
Wins
<br>
<b id="wins">0</b>
</div>

</div>


<div class="game">

<div class="cards">

<div class="card" id="card1" onclick="choose(1)">
❓
</div>

<div class="card" id="card2" onclick="choose(2)">
❓
</div>

</div>

<button onclick="newRound()">Start Round</button>

<div class="result" id="result">
Choose a card
</div>

</div>

</div>


<script>

let round=0;
let score=0;
let wins=0;
let answer=0;
let locked=false;


function newRound(){

round++;

document.getElementById("round").innerHTML=round;

answer=Math.floor(Math.random()*2)+1;

document.getElementById("card1").innerHTML="❓";
document.getElementById("card2").innerHTML="❓";

document.getElementById("result").innerHTML="Choose a card";

locked=false;

}


function choose(card){

if(locked) return;

locked=true;


if(card===answer){

document.getElementById("card"+card).innerHTML="🏆";

score+=10;
wins++;

document.getElementById("result").innerHTML="You Win! 🎉";

}else{

document.getElementById("card"+card).innerHTML="❌";

document.getElementById("result").innerHTML="Try Again";

}


document.getElementById("score").innerHTML=score;
document.getElementById("wins").innerHTML=wins;


setTimeout(()=>{

locked=false;

},1000);

}


newRound();

</script>

</body>
</html>
