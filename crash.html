<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Crash</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.multiplier{
font-size:60px;
margin:50px 0;
color:#00eaff;
}

button{
background:#00eaff;
border:none;
padding:15px 30px;
border-radius:25px;
font-size:18px;
font-weight:bold;
margin:10px;
}

.result{
font-size:22px;
margin-top:20px;
}

</style>

</head>

<body>

<header>
💥 PlayVerse Crash
</header>


<h2>Hard Crash Challenge</h2>


<div class="multiplier" id="multi">
1.00x
</div>


<button onclick="startGame()">
START
</button>


<button onclick="cashOut()">
CASH OUT
</button>


<div class="result" id="result">
Choose your move
</div>


<script>

let value=1;
let crashPoint;
let running=false;
let timer;


function startGame(){

if(running)return;


value=1;

crashPoint=(Math.random()*4+1).toFixed(2);


document.getElementById("multi").innerHTML=
"1.00x";


document.getElementById("result").innerHTML=
"Flying...";


running=true;


timer=setInterval(()=>{


value+=0.10;


document.getElementById("multi").innerHTML=
value.toFixed(2)+"x";


if(value>=crashPoint){

clearInterval(timer);

running=false;

document.getElementById("result").innerHTML=
"💥 CRASH! You Lose.";

}


},300);


}



function cashOut(){

if(!running)return;


clearInterval(timer);

running=false;


document.getElementById("result").innerHTML=
"🏆 Cashed out at "+
value.toFixed(2)+"x";

}


</script>


</body>
</html>
