<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Crash</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#050814;
color:white;
}


header{
background:#10162d;
padding:18px;
text-align:center;
color:#00eaff;
font-size:25px;
font-weight:bold;
}


.game{
max-width:600px;
margin:auto;
padding:20px;
}


.panel{
background:#10162d;
border:1px solid #263056;
border-radius:18px;
padding:18px;
margin-bottom:18px;
text-align:center;
}


.lock{
font-size:60px;
}


button{
border:0;
padding:15px;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}


.join{
background:#00eaff;
width:100%;
}


#gameArea{
display:none;
}


.crashBox{
height:300px;
background:#070b19;
border-radius:15px;
position:relative;
overflow:hidden;
}


.rocket{
font-size:60px;
position:absolute;
bottom:30px;
left:45%;
transition:.3s;
}


.multiplier{
font-size:60px;
color:#00eaff;
margin:20px;
}


.buttons{
display:flex;
gap:10px;
}


.start{
background:#00eaff;
width:50%;
}


.cash{
background:#00c853;
color:white;
width:50%;
}


.result{
font-size:22px;
}

</style>

</head>


<body>


<header>
💥 PlayVerse Crash
</header>


<div class="game">


<div class="panel" id="lock">


<div class="lock">
🔒
</div>


<h2>
Crash Locked
</h2>


<p>
Join tournament to unlock Crash challenge.
</p>


<button class="join" onclick="unlock()">
JOIN TOURNAMENT
</button>


</div>




<div id="gameArea">


<div class="panel">


<div class="multiplier" id="multi">
1.00x
</div>


<div class="crashBox">

<div class="rocket" id="rocket">
🚀
</div>


</div>


</div>




<div class="panel buttons">


<button class="start" onclick="startGame()">
START
</button>


<button class="cash" onclick="cashOut()">
CASH OUT
</button>


</div>



<div class="panel result" id="result">
Ready
</div>



</div>


</div>



<script>


let value=1;
let crashPoint;
let timer;
let running=false;



function unlock(){

document.getElementById("lock").style.display="none";

document.getElementById("gameArea").style.display="block";

}



function startGame(){

if(running)return;


value=1;

crashPoint=(Math.random()*5+1);


running=true;


document.getElementById("result").innerHTML=
"🚀 Taking off...";


timer=setInterval(()=>{


value+=0.12;


document.getElementById("multi").innerHTML=
value.toFixed(2)+"x";


document.getElementById("rocket").style.bottom=
(30+value*18)+"px";



if(value>=crashPoint){


clearInterval(timer);

running=false;


document.getElementById("result").innerHTML=
"💥 CRASH! You lost";


}



},300);


}




function cashOut(){

if(!running)return;


clearInterval(timer);

running=false;


document.getElementById("result").innerHTML=
"🏆 Cashed out at "+
value.toFixed(2)+"x";


}


</script>


</body>
</html>
