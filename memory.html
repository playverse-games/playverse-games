<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Memory</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#050814;
    color:white;
}

header{
    background:#10162d;
    padding:18px;
    text-align:center;
    color:#00eaff;
    font-size:25px;
    font-weight:bold;
    border-bottom:1px solid #263056;
}

.game{
    max-width:600px;
    margin:auto;
    padding:18px;
}

.panel{
    background:#10162d;
    border:1px solid #263056;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    text-align:center;
}

.hud{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:#080d1d;
    border-radius:10px;
    padding:10px 5px;
    font-size:13px;
    color:#9da3bb;
}

.stat strong{
    display:block;
    color:#00eaff;
    font-size:18px;
    margin-top:4px;
}

.board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    max-width:420px;
    margin:auto;
}

.card{
    height:85px;
    border:0;
    border-radius:12px;
    background:#18203d;
    color:white;
    font-size:28px;
    cursor:pointer;
    border:1px solid #2a3560;
    transition:.2s;
}

.card:hover{
    border-color:#00eaff;
    transform:translateY(-2px);
}

.card.flipped,
.card.matched{
    background:#0b3040;
    border-color:#00eaff;
}

.card.matched{
    opacity:.7;
}

button{
    border:0;
    border-radius:12px;
    padding:14px 25px;
    background:#00eaff;
    color:#001016;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.result{
    min-height:28px;
    font-size:20px;
    color:#00eaff;
}

@media(max-width:420px){
    .card{
        height:72px;
        font-size:24px;
    }

    .game{
        padding:12px;
    }
}
</style>
</head>

<body>

<header>
🧠 PlayVerse Memory
</header>

<div class="game">

    <div class="panel">
        <h2>Hard Memory Challenge</h2>
        <p>Match all pairs before your mistakes run out.</p>
    </div>

    <div class="panel hud">
        <div class="stat">
            TIME
            <strong id="time">30</strong>
        </div>

        <div class="stat">
            MISTAKES
            <strong id="mistakes">0 / 5</strong>
        </div>

        <div class="stat">
            MATCHES
            <strong id="matches">0 / 6</strong>
        </div>
    </div>

    <div class="panel">

        <div class="board" id="board"></div>

    </div>

    <div class="panel">

        <button onclick="startGame()">
            NEW ROUND
        </button>

        <div class="result" id="result">
            Press NEW ROUND to start.
        </div>

    </div>

</div>

<script>

const symbols = [
    "⚡","🔥","💎","🚀","🎯","👑"
];

let deck = [];
let firstCard = null;
let secondCard = null;
let locked = false;
let mistakes = 0;
let matches = 0;
let time = 30;
let timer = null;
let gameActive = false;

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i]];
    }

    return array;
}

function startGame(){

    clearInterval(timer);

    deck = shuffle([...symbols,...symbols]);

    firstCard = null;
    secondCard = null;
    locked = false;
    mistakes = 0;
    matches = 0;
    time = 30;
    gameActive = true;

    document.getElementById("mistakes").textContent =
        "0 / 5";

    document.getElementById("matches").textContent =
        "0 / 6";

    document.getElementById("time").textContent =
        time;

    document.getElementById("result").textContent =
        "Find the matching pairs.";

    const board = document.getElementById("board");

    board.innerHTML = "";

    deck.forEach((symbol,index)=>{

        const card = document.createElement("button");

        card.className = "card";

        card.dataset.index = index;

        card.dataset.symbol = symbol;

        card.textContent = "❓";

        card.onclick = () => flipCard(card);

        board.appendChild(card);
    });

    timer = setInterval(()=>{

        time--;

        document.getElementById("time").textContent =
            time;

        if(time <= 0){

            endGame("⏰ Time is up. You lose.");

        }

    },1000);
}

function flipCard(card){

    if(!gameActive || locked) return;

    if(card.classList.contains("flipped") ||
       card.classList.contains("matched")) return;

    card.classList.add("flipped");

    card.textContent = card.dataset.symbol;

    if(!firstCard){

        firstCard = card;

        return;
    }

    secondCard = card;

    locked = true;

    if(firstCard.dataset.symbol ===
       secondCard.dataset.symbol){

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        matches++;

        document.getElementById("matches").textContent =
            matches + " / 6";

        firstCard = null;
        secondCard = null;
        locked = false;

        if(matches === 6){

            endGame("🏆 Perfect! You matched every pair.");
        }

    }else{

        mistakes++;

        document.getElementById("mistakes").textContent =
            mistakes + " / 5";

        setTimeout(()=>{

            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");

            firstCard.textContent = "❓";
            secondCard.textContent = "❓";

            firstCard = null;
            secondCard = null;
            locked = false;

        },650);

        if(mistakes >= 5){

            setTimeout(()=>{
                endGame("❌ Too many mistakes. You lose.");
            },700);
        }
    }
}

function endGame(message){

    gameActive = false;

    locked = true;

    clearInterval(timer);

    document.getElementById("result").textContent =
        message;
}

startGame();

</script>

</body>
</html>
