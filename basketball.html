<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Basketball</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.court{
width:90%;
max-width:400px;
height:450px;
margin:20px auto;
background:#9b5a20;
border:4px solid white;
border-radius:15px;
position:relative;
overflow:hidden;
}

.hoop{
position:absolute;
top:30px;
width:100%;
font-size:50px;
}

.ball{
position:absolute;
bottom:30px;
left:45%;
font-size:50px;
transition:.5s;
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-size:18px;
font-weight:bold;
}

.stats{
margin:15px;
}

.result{
font-size:22px;
color:#00eaff;
margin-top:20px;
}

</style>

</head>


<body>


<header>
🏀 PlayVerse Basketball
</header>


<h2>Hard Shooting Challenge</h2>


<div class="stats">
Shots: <span id="shots">0</span>
&nbsp;
Score: <span id="score">0</span>
</div>


<div class="court">

<div class="hoop">
🟠🏀
</div>


<div class="ball" id="ball">
🏀
</div>


</div>


<button onclick="shoot()">
SHOOT
</button>


<div class="result" id="result">
Try your shot!
</div>


<script>

let shots=0;
let score=0;


function shoot(){

shots++;

document.getElementById("shots").innerHTML=shots;


let ball=document.getElementById("ball");

ball.style.bottom="330px";


setTimeout(()=>{


let chance=Math.random();


if(chance>0.65){

score+=10;

document.getElementById("result").innerHTML=
"🏀 Perfect Shot +10";

}else{

document.getElementById("result").innerHTML=
"❌ Missed Shot";

}


document.getElementById("score").innerHTML=score;


ball.style.bottom="30px";


},600);


}

</script>


</body>
</html>
