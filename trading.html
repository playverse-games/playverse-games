<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Trading Prediction</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.market{
margin:30px auto;
font-size:45px;
color:#00eaff;
}

.price{
font-size:35px;
margin:20px;
}

button{
background:#00eaff;
border:none;
padding:15px 30px;
border-radius:25px;
font-size:18px;
font-weight:bold;
margin:10px;
}

.result{
font-size:22px;
margin-top:25px;
}

</style>

</head>

<body>

<header>
📈 PlayVerse Trading Prediction
</header>


<h2>Market Challenge</h2>


<div class="market">
📊
</div>


<div class="price">
Price: $<span id="price">100</span>
</div>


<button onclick="predict('up')">
📈 UP
</button>


<button onclick="predict('down')">
📉 DOWN
</button>


<div class="result" id="result">
Make your prediction
</div>


<script>

let price=100;


function predict(choice){


let movement=Math.random()>0.5 ? "up":"down";


if(movement==="up"){

price+=Math.floor(Math.random()*10)+1;

}else{

price-=Math.floor(Math.random()*10)+1;

}


document.getElementById("price").innerHTML=price;


if(choice===movement){

document.getElementById("result").innerHTML=
"🏆 Correct Prediction!";

}else{

document.getElementById("result").innerHTML=
"❌ Wrong Prediction.";

}


}

</script>


</body>
</html>
