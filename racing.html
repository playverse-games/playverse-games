<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Racing</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#080b18;
color:white;
min-height:100vh;
}

header{
background:#11162b;
padding:20px;
text-align:center;
border-bottom:1px solid #252b50;
}

.logo{
font-size:26px;
font-weight:bold;
color:#00eaff;
}

.container{
padding:20px;
text-align:center;
}

h1{
margin-bottom:10px;
}

p{
color:#aaa;
margin-bottom:20px;
}

.track{
width:100%;
max-width:400px;
height:350px;
background:#151b35;
border-radius:15px;
margin:auto;
position:relative;
overflow:hidden;
border:3px solid #252b50;
}

.finish{
position:absolute;
top:10px;
left:0;
width:100%;
text-align:center;
font-size:25px;
}

.car{
position:absolute;
bottom:10px;
left:45%;
font-size:45px;
transition:.3s;
}

.stats{
display:flex;
justify-content:space-around;
margin:25px 0;
}

.box{
background:#151b35;
padding:15px;
border-radius:12px;
width:30%;
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:22px;
color:#00eaff;
}

</style>

</head>

<body>

<header>
<div class="logo">🎮 PlayVerse Games</div>
</header>


<div class="container">

<h1>🏎️ Racing Challenge</h1>

<p>Tap race and reach the finish line first.</p>


<div class="stats">

<div class="box">
Race
<br>
<b id="race">0</b>
</div>

<div class="box">
Wins
<br>
<b id="wins">0</b>
</div>

<div class="box">
Speed
<br>
<b id="speed">0</b>
</div>

</div>


<div class="track">

<div class="finish">
🏁 FINISH
</div>

<div class="car" id="car">
🏎️
</div>

</div>


<br>

<button onclick="raceCar()">
Start Race
</button>


<div class="result" id="result">
Ready to race!
</div>


</div>


<script>

let position=10;
let race=0;
let wins=0;


function raceCar(){

race++;

document.getElementById("race").innerHTML=race;


position += Math.floor(Math.random()*40)+20;


document.getElementById("car").style.bottom=position+"px";


document.getElementById("speed").innerHTML=
Math.floor(Math.random()*100)+" km/h";


if(position>=280){

wins++;

document.getElementById("wins").innerHTML=wins;

document.getElementById("result").innerHTML=
"You won the race! 🏆";

position=10;

document.getElementById("car").style.bottom=
position+"px";

}else{

document.getElementById("result").innerHTML=
"Racing... 🏎️";

}

}

</script>

</body>
</html>
