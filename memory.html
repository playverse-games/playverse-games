<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Memory</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#080b18;
color:white;
text-align:center;
}

header{
background:#11162b;
padding:20px;
color:#00eaff;
font-size:24px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(4,70px);
gap:10px;
justify-content:center;
margin:25px auto;
}

.card{
width:70px;
height:70px;
background:#252b50;
border-radius:10px;
font-size:35px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.open{
background:#00eaff;
}

button{
background:#00eaff;
border:none;
padding:15px 35px;
border-radius:25px;
font-size:18px;
font-weight:bold;
}

.result{
margin-top:20px;
color:#00eaff;
font-size:22px;
}

</style>
</head>

<body>

<header>
🧠 PlayVerse Memory
</header>

<h2>Hard Memory Challenge</h2>

<p>Wrong match = Fail</p>

<div class="grid" id="grid"></div>

<button onclick="startGame()">START</button>

<div class="result" id="result">
Remember the cards!
</div>


<script>

let cards=[];
let first=null;
let second=null;
let lock=false;
let matched=0;


function startGame(){

let icons=[
"🔥","🔥",
"⭐","⭐",
"🍀","🍀",
"💎","💎",
"⚡","⚡",
"🎮","🎮",
"🏆","🏆",
"🚀","🚀"
];


cards=icons.sort(()=>Math.random()-0.5);

let grid=document.getElementById("grid");

grid.innerHTML="";

matched=0;

cards.forEach(icon=>{

let card=document.createElement("div");

card.className="card";

card.dataset.icon=icon;

card.innerHTML="❓";

card.onclick=()=>flip(card);

grid.appendChild(card);

});


document.getElementById("result").innerHTML=
"Game Started!";

}



function flip(card){

if(lock || card.innerHTML!=="❓") return;


card.innerHTML=card.dataset.icon;


if(!first){

first=card;

}else{

second=card;

check();

}

}



function check(){

if(first.dataset.icon===second.dataset.icon){

first.classList.add("open");
second.classList.add("open");

matched+=2;

first=null;
second=null;


if(matched===cards.length){

document.getElementById("result").innerHTML=
"🏆 You Win!";

}


}else{


lock=true;


setTimeout(()=>{


document.getElementById("result").innerHTML=
"❌ Wrong match! Failed.";


first.innerHTML="❓";
second.innerHTML="❓";


first=null;
second=null;

lock=false;


},700);


}


}

</script>

</body>
</html>
