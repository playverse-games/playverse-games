<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlayVerse Basketball</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#080b18;
color:white;
min-height:100vh;
}

header{
background:#11162b;
padding:20px;
text-align:center;
border-bottom:1px solid #252b50;
}

.logo{
color:#00eaff;
font-size:26px;
font-weight:bold;
}

.container{
padding:20px;
text-align:center;
}

h1{
margin-bottom:10px;
}

p{
color:#aaa;
margin-bottom:20px;
}

.stats{
display:flex;
justify-content:space-around;
margin-bottom:25px;
}

.box{
background:#151b35;
padding:15px;
border-radius:12px;
width:30%;
}

.court{
height:350px;
max-width:400px;
margin:auto;
background:#b5651d;
border-radius:20px;
position:relative;
overflow:hidden;
border:4px solid #fff;
}

.hoop{
position:absolute;
top:25px;
left:40%;
font-size:55px;
}

.ball{
position:absolute;
bottom:25px;
left:45%;
font-size:50px;
transition:0.5s;
}

button{
margin-top:25px;
background:#00eaff;
border:none;
padding:15px 40px;
border-radius:25px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:20px;
color:#00eaff;
font-size:22px;
}
</style>

</head>

<body>

<header>
<div class="logo">🎮 PlayVerse Games</div>
</header>

<div class="container">

<h1>🏀 Basketball Challenge</h1>

<p>Shoot the ball and get the highest score!</p>


<div class="stats">

<div class="box">
Shots
<br>
<b id="shots">0</b>
</div>

<div class="box">
Score
<br>
<b id="score">0</b>
</div>

<div class="box">
Best
<br>
<b id="best">0</b>
</div>

</div>


<div class="court">

<div class="hoop">
🏀🟠
</div>

<div class="ball" id="ball">
🏀
</div>

</div>


<button onclick="shoot()">
Shoot Ball
</button>


<div class="result" id="result">
Ready to play!
</div>


</div>


<script>

let shots=0;
let score=0;
let best=0;


function shoot(){

shots++;

document.getElementById("shots").innerHTML=shots;


let ball=document.getElementById("ball");

ball.style.bottom="250px";


setTimeout(()=>{

let chance=Math.random();


if(chance>0.45){

score+=10;

document.getElementById("result").innerHTML=
"🏀 Perfect Shot! +10";

}else{

document.getElementById("result").innerHTML=
"Missed! Try again";

}


if(score>best){
best=score;
}


document.getElementById("score").innerHTML=score;
document.getElementById("best").innerHTML=best;


ball.style.bottom="25px";


},600);

}

</script>

</body>
  </html>
